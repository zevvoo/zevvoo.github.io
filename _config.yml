####  GLOBAL - Site information
title: zevvoo
author:
  name: &name zevvoo                     # removing &name breaks contact page
  email: &email jewoo010204@gmail.com    # removing &email breaks contact page
description: >
  보안 늦입문 컴공러의 스터디 아카이브입니다.

url: "https://zevvoo.github.io"

lang: ko
timezone: Asia/Seoul

#### SETTINGS - Sitewide preferences
show_excerpts: true
show_categories: true
paginate: 5
paginate_path: /page/:num
permalink: /:year/:month/:day/:title/

#### THEME - Controls for desktop and extra pages
jekyll-98:
  date_format: "%Y-%m-%d"

  add_titles: true   # render the post title inside the window

  ### SITE ICON
  icon: computer

  ### DESKTOP FOLDERS - post categories that get their own desktop folder icon
  desktop_categories:
    - Security
    - Projects
    - Issues
    - Blog

  ### DESKTOP / START MENU LINKS
  site_links:
    - title: GitHub
      url: https://github.com/zevvoo
      target: _blank
      icon: html
      alt: 'zevvoo on GitHub'

  ### CONTACT PAGE
  contact:
    name: *name
    email: *email

  ### SOCIAL MEDIA / QUICK LAUNCH
  social_links:
    github: zevvoo

  ### ABOUT PAGE
  about:
    - 고려대학교 세종캠퍼스 컴퓨터소프트웨어학과
    - 보안 & LLM/AI 에이전트에 관심이 많습니다.
    - 해킹 연구 동아리 KUality 소속

#### PLUGINS - theme defaults, don't remove
plugins:
  - jekyll-paginate
  - jekyll-category-pages
  - jekyll-feed

#### DEFAULTS
defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"

#### BUILD
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - Gemfile.chirpy.bak
  - _config.yml.chirpy.bak
  - README.md
  - LICENSE
  - tools
  - "*.gem"
